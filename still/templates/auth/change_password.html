<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password – Mzuzu University</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background:var(--bg, #f0f4f8); font-family:'DM Sans',Arial,sans-serif;">
{% include "partials/navbar.html" ignore missing %}
<div style="max-width:420px; margin:60px auto; padding:0 16px;">
<div class="card">
    <div class="card-header">
        <span class="brand">● Mzuzu University</span>
        <h1>Change Password</h1>
        <p>Update your account password</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.change_password') }}">
        <div class="form-group">
            <label class="field-label">Current Password</label>
            <div class="input-wrap">
                <input type="password" id="cp" name="current_password"
                       placeholder="Current password" required>
                <button type="button" class="toggle-pw" onclick="togglePassword('cp',this)">
                    <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="form-group">
            <label class="field-label">New Password</label>
            <div class="input-wrap">
                <input type="password" id="np" name="new_password"
                       placeholder="Min. 8 characters" required>
                <button type="button" class="toggle-pw" onclick="togglePassword('np',this)">
                    <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="form-group">
            <label class="field-label">Confirm New Password</label>
            <div class="input-wrap">
                <input type="password" id="cp2" name="confirm_password"
                       placeholder="Repeat new password" required>
                <button type="button" class="toggle-pw" onclick="togglePassword('cp2',this)">
                    <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>
        <button type="submit">Update Password</button>
    </form>
    <div class="card-footer">
        <a href="{{ url_for('dashboard.profile') }}">← Back to Profile</a>
    </div>
</div>
</div>
<script>
function togglePassword(fieldId, btn) {
    const input = document.getElementById(fieldId);
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    btn.querySelector('.eye-icon').style.opacity = isHidden ? '1' : '0.4';
}
</script>
</body>
</html>
