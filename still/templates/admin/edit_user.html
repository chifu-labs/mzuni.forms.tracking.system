{% extends "base.html" %}
{% block title %}Edit User{% endblock %}
{% block content %}
<div class="page-header">
    <div class="page-header-left"><h1>Edit User</h1><p>{{ user.full_name }}</p></div>
    <a href="{{ url_for('admin.manage_users') }}" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i> Back</a>
</div>
<div class="card" style="max-width:600px;">
    <div class="card-header"><i class="fas fa-user-edit"></i><h2>Edit Account</h2></div>
    <div class="card-body">
    <form method="POST">
        <div class="form-row">
            <div class="form-group"><label class="form-label">Full Name</label><input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required></div>
            <div class="form-group"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ user.email }}" required></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label class="form-label">Post</label><input type="text" name="post" class="form-control" value="{{ user.post or '' }}"></div>
            <div class="form-group"><label class="form-label">Grade</label><input type="text" name="grade" class="form-control" value="{{ user.grade or '' }}"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label class="form-label">Role</label>
                <select name="role_id" class="form-control" required>
                {% for r in roles %}<option value="{{ r.id }}" {% if r.id == user.role_id %}selected{% endif %}>{{ r.name }}</option>{% endfor %}
                </select></div>
            <div class="form-group"><label class="form-label">Department</label>
                <select name="department_id" class="form-control">
                <option value="">-- None --</option>
                {% for d in departments %}<option value="{{ d.id }}" {% if d.id == user.department_id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}
                </select></div>
        </div>
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
        <a href="{{ url_for('admin.manage_users') }}" class="btn btn-outline" style="margin-left:8px;">Cancel</a>
    </form>
    </div>
</div>
{% endblock %}
